<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wish You Were Here</title>
<style>
:root{--bg:#0f0d14;--panel:#191622;--line:#2b2536;--ink:#f2ecff;--dim:#9a90ad;
      --accent:#ffb86b;--accent2:#ff7eb6;--ok:#7ee787;--bad:#ff7b72}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 ui-serif,Georgia,serif}
.wrap{max-width:880px;margin:0 auto;padding:40px 20px 90px}
h1{font-size:clamp(30px,4.6vw,44px);letter-spacing:-.02em;font-weight:600}
h1 span{color:var(--accent)}
.sub{color:var(--dim);margin:8px 0 30px;font-size:15.5px;max-width:62ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:7px;font-family:ui-sans-serif,system-ui,sans-serif}
input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#120f19;color:var(--ink);font:inherit;font-size:15px}
input:focus{outline:none;border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:620px){.row{grid-template-columns:1fr}}
button{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#22141f;border:0;padding:13px 24px;border-radius:9px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%;font-family:ui-sans-serif,system-ui,sans-serif}
button:disabled{opacity:.5;cursor:default}
.steps{list-style:none;font-size:14.5px}
.steps li{padding:7px 0;color:#5f5772;display:flex;gap:11px;align-items:baseline;transition:color .3s}
.steps li.done{color:var(--ink)}.steps li.failed{color:var(--bad)}
.steps li.running{color:var(--accent)}.steps li.skipped{color:var(--dim)}
.ic{width:1.2em;display:inline-block;text-align:center}
.det{color:var(--dim);font-size:12.5px}
.lyr{white-space:pre-wrap;font-size:17.5px;line-height:1.9;font-style:italic}
img.pc{width:100%;border-radius:11px;display:block;border:1px solid var(--line)}
audio{width:100%;margin-top:14px}
a{color:var(--accent)}
.muted{color:var(--dim);font-size:13px;font-family:ui-sans-serif,system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#120f19;cursor:pointer;text-decoration:none;color:inherit;display:block}
.tile img{width:100%;height:96px;object-fit:cover;display:block}
.tile .cap{padding:8px 10px;font-size:12.5px;line-height:1.35}
.tile .cap b{display:block;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-family:ui-sans-serif,system-ui,sans-serif}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin-right:6px;font-family:ui-sans-serif,system-ui,sans-serif}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ok);font-family:ui-sans-serif,system-ui,sans-serif}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ok);animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.err{color:var(--bad);font-size:14px}
.send{display:flex;gap:11px}
.send button{width:auto;flex:1}
button.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
button.ghost:hover{color:var(--ink);border-color:var(--accent)}
ul.det-list{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:13.5px}
</style>
</head>
<body><div class="wrap" id="app">
  <h1>Wish You Were <span>Here</span></h1>
  <p class="sub">Someone you love is far away. This finds out what today was actually like
  where they are — from what people posted there this morning — and sends them a postcard
  with a song on the back.</p>
  <p class="muted" id="boot">Connecting…</p>
</div>

<script type="module">
import { ConvexClient } from "https://esm.sh/convex@1.44.0/browser";
import { anyApi } from "https://esm.sh/convex@1.44.0/server";

const app = document.getElementById("app");
// Injected when served from Convex itself; falls back to the local dev server.
const convexUrl = window.__CONVEX_URL__ || (await (await fetch("/config")).json()).convexUrl;
const client = new ConvexClient(convexUrl);
const api = anyApi;

const esc = (s) => String(s ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const ICON = { pending: "○", running: "◐", done: "✅", failed: "❌", skipped: "–" };

let unsub = null;
const stop = () => { if (unsub) { unsub(); unsub = null; } };

/* ------------------------------------------------------------- home view */
function home() {
  stop();
  location.hash = "";
  app.innerHTML = `
    <h1>Wish You Were <span>Here</span></h1>
    <p class="sub">Someone you love is far away. This finds out what today was actually like
    where they are — from what people posted there this morning — and sends them a postcard
    with a song on the back.</p>

    <div class="card">
      <div class="row">
        <div><label>Their name</label><input id="recipient" placeholder="Mum"></div>
        <div><label>The city they're in</label><input id="city" placeholder="Manila"></div>
      </div>
      <div class="row">
        <div><label>Your name</label><input id="sender" placeholder="Nelson"></div>
        <div><label>Their email — optional, we'll send it</label><input id="email" placeholder="mum@…"></div>
      </div>
      <div class="row">
        <div><label>Their phone — optional, we'll call them</label><input id="phone" placeholder="+1…"></div>
        <div><label>Password</label><input id="pw" type="password" placeholder="••••••••"></div>
      </div>
      <button id="go">Make their postcard</button>
      <p class="muted" id="gerr" style="margin-top:11px;display:none"></p>
    </div>

    <div id="live"></div>
    <div class="card"><label>Made so far</label><div class="grid" id="recent"></div></div>`;

  // Remembered so the demo isn't retyping a password on stage.
  const pwField = document.getElementById("pw");
  pwField.value = localStorage.getItem("wywh_pw") ?? "";

  document.getElementById("go").onclick = async () => {
    const go = document.getElementById("go");
    const err = document.getElementById("gerr");
    const password = pwField.value;
    if (!password) {
      err.style.display = "block";
      err.textContent = "Password required — generation costs real quota.";
      return;
    }
    const b = {
      city: document.getElementById("city").value.trim() || "Manila",
      recipient: document.getElementById("recipient").value.trim() || "you",
      sender: document.getElementById("sender").value.trim() || "someone",
      phone: document.getElementById("phone").value.trim() || undefined,
      email: document.getElementById("email").value.trim() || undefined,
      password,
    };
    go.disabled = true;
    err.style.display = "none";
    try {
      const id = await client.mutation(api.postcards.create, b);
      localStorage.setItem("wywh_pw", password);
      watch(id, true);
    } catch (e) {
      go.disabled = false;
      err.style.display = "block";
      err.textContent = /password/i.test(String(e.message)) ? "Wrong password." : "Couldn't start — try again.";
    }
  };

  // Reactive: new postcards appear here the moment anyone makes one.
  unsub = client.onUpdate(api.postcards.list, {}, (rows) => {
    const el = document.getElementById("recent");
    if (!el) return;
    el.innerHTML = rows.length
      ? rows.map((r) => `<a class="tile" href="#${r._id}">
          ${r.cardUrl ? `<img src="${r.cardUrl}" alt="">` : `<div style="height:96px;background:#1d1927"></div>`}
          <div class="cap"><b>${esc(r.city)}</b>${esc(r.sender)} → ${esc(r.recipient)}</div></a>`).join("")
      : `<p class="muted">Nothing yet.</p>`;
  });
}

/* ------------------------------------------------- live build + card view */
function watch(id, inline) {
  stop();
  if (!inline) app.innerHTML = `<p class="muted">Loading…</p>`;
  location.hash = id;

  unsub = client.onUpdate(api.postcards.get, { id }, (j) => {
    if (!j) { app.innerHTML = `<h1>Not found</h1><p><a href="#" onclick="location.reload()">← back</a></p>`; return; }

    if (j.state === "running") {
      const target = inline ? document.getElementById("live") : app;
      if (!target) return;
      target.innerHTML = `<div class="card">
        <label>Building <span class="live"><span class="dot"></span>live</span></label>
        <ul class="steps">${j.steps.map((s) => `<li class="${s.status}">
          <span class="ic">${ICON[s.status] ?? "?"}</span>
          <span>${esc(s.label)}${s.detail ? ` <span class="det">(${esc(s.detail)})</span>` : ""}</span>
        </li>`).join("")}</ul></div>`;
      return;
    }

    // finished — render the postcard
    inline = false;
    app.innerHTML = `
      <h1>${esc(j.recipient)},</h1>
      <p class="sub">${esc(j.sender)} made you this from ${esc(j.city)} — ${new Date(j.startedAt).toDateString()}</p>
      ${j.cardUrl ? `<div class="card" style="padding:12px"><img class="pc" src="${j.cardUrl}" alt=""></div>` : ""}
      ${j.audioUrl
        ? `<div class="card"><label>The song</label><audio controls preload="auto" src="${j.audioUrl}"></audio>
           <p class="muted" style="margin-top:10px">Written from ${j.postCount ?? 0} posts made in ${esc(j.city)} today.</p></div>`
        : `<p class="err">${esc(j.error ?? "The song didn't come through.")}</p>`}
      <div class="card"><label>The words</label><p class="lyr">${esc(j.lyrics)}</p></div>
      <div class="card"><label>Send it to them</label>
        <div class="send">
          <button id="share">Send${j.emailSent ? " again" : ""}</button>
          <button id="copy" class="ghost">Copy link</button>
        </div>
        <p class="muted" id="shareNote" style="margin-top:11px">
          ${j.emailSent ? `Emailed to ${esc(j.email)}. ` : ""}Opens your share sheet — text, email, anything.
        </p>
      </div>
      <div class="card"><label>What ${esc(j.city)} was like today</label>
        <ul class="det-list">${(j.details ?? []).map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
        <p class="muted" style="margin-top:14px">
          <span class="pill">Convex</span>state · files · realtime
          <span class="pill">Apify</span>${j.postCount ?? 0} posts scraped${j.fromCache ? " (cached)" : ""}
          <span class="pill">Gemini</span>lyrics · Lyria · Nano Banana
          ${j.callId ? `<span class="pill">Vapi</span>called` : ""}
        </p></div>
      <p class="muted"><a href="#" id="back">← make another</a></p>`;
    const b = document.getElementById("back");
    if (b) b.onclick = (e) => { e.preventDefault(); home(); };

    const link = location.href;
    const note = document.getElementById("shareNote");
    const copy = async () => {
      try { await navigator.clipboard.writeText(link); }
      catch { prompt("Copy this link:", link); return; }
      if (note) { note.textContent = "Link copied — paste it wherever you like."; }
    };
    const shareBtn = document.getElementById("share");
    if (shareBtn) shareBtn.onclick = async () => {
      const data = {
        title: `A postcard from ${j.city}`,
        text: `${j.sender} made you a postcard from ${j.city}, with a song on the back.`,
        url: link,
      };
      // Native share sheet covers SMS, email, WhatsApp — no provider needed.
      if (navigator.share) {
        try { await navigator.share(data); return; } catch { /* cancelled — fall through */ }
      }
      copy();
    };
    const copyBtn = document.getElementById("copy");
    if (copyBtn) copyBtn.onclick = copy;
  });
}

addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  h ? watch(h, false) : home();
});

location.hash.slice(1) ? watch(location.hash.slice(1), false) : home();
</script>
</body>
</html>
